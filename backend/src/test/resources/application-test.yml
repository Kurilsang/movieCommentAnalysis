spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.moviereview.user
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: testSecretKeyForMovieSentimentSystem2024VeryLongAndSecure
  expiration: 86400000

logging:
  level:
    com.moviereview: debug
