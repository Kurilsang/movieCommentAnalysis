spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true

# 测试环境不导入真实 CSV（测试自备种子数据）
app:
  data:
    dir: ./nonexistent-test-data
    import-enabled: false

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.moviereview.movie,com.moviereview.user
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: testSecretKeyForMovieSentimentSystem2024VeryLongAndSecure
  expiration: 86400000

logging:
  level:
    com.moviereview: info
