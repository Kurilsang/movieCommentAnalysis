server:
  port: 8080

spring:
  application:
    name: movie-sentiment-backend

  datasource:
    url: jdbc:mysql://localhost:3306/movie_sentiment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 启动时自动建表（幂等：全部 CREATE TABLE IF NOT EXISTS）
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true

  data:
    redis:
      host: localhost
      port: 6379
      # Redis 可选：开发机不启动 Redis 时也能跑（用 MySQL 表替代缓存）
      # 如需启用 Redis，去掉下面 exclude 并启动 Redis

# 数据导入配置（启动时从 data/*.csv 灌库，幂等）
app:
  data:
    dir: ../data
    import-enabled: true

# Redis 自动配置排除（开发机不需要 Redis）
# spec 决策：Redis 只做缓存与爬虫任务状态，用 MySQL 表替代同样有效
spring.autoconfigure.exclude:
  - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.moviereview.movie,com.moviereview.user
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: false

logging:
  level:
    com.moviereview: debug
