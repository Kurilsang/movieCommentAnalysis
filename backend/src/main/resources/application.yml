server:
  port: 8080

spring:
  application:
    name: movie-sentiment-backend

  datasource:
    url: jdbc:mysql://localhost:3306/movie_sentiment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.moviereview.domain
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.moviereview: debug
